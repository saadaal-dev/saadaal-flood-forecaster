[river_data]
swalim_api_url = https://frrims.faoswalim.org/rivers/levels

[data]
data_path = data

[data.database]
dbname = postgres
user = postgres
host = localhost
port = 5432

[openmeteo]
api_url = https://api.open-meteo.com/v1/forecast
api_archive_url = https://archive-api.open-meteo.com/v1/archive
store_base_path = data/raw/

[data.static]
weather_location_data_path = ${data:data_path}/static/forecast-locations.csv

[data.ingestion]
use_database = True

[data.sensor]
use_sensor_rainfall = False
rainfall_sensor_meaning = Rainfall
sensor_stations_file = data/static/sensor-stations.csv
sensor_max_distance_km = 50
