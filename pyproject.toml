[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-forecaster"
version = "0.1.2"
description = "Flood forecasting libraries and CLI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    "requests~=2.32.3",
    "SQLAlchemy~=2.0.36",
    "configparser~=7.1.0",
    "mailjet-rest~=1.3.4",
    "pandas~=2.3.0",
    "pandera[pandas]~=0.24.0",
    "requests-cache~=1.2.1",
    "psycopg2-binary~=2.9.10",
    "scikit-learn~=1.5.0",
    "matplotlib~=3.7.5",
    "seaborn~=0.13.2",
    "prophet==1.1.6",
    "xgboost~=3.0.2",
    "click~=8.1.7",
    "beautifulsoup4~=4.12.3",
    "python-dotenv~=0.19.2",
    "joblib>=1.5.0",
    "numpy>=1.26.0",
    "openmeteo_sdk~=1.20.1",
    "openmeteo_requests~=1.7.2",
    "retry_requests~=2.0.0",
    "lxml>=5.0.2",
    "urllib3~=1.26.20",
    "plotly~=6.0.0",
    "tabulate~=0.9.0",
    "sentry-sdk~=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
    "mypy",
    "types-requests",
    "tox",
    "detect-secrets",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
flood-cli = "flood_forecaster_cli.main:cli"

# ─── Ruff configuration (replaces flake8, black, isort) ───
[tool.ruff]
target-version = "py312"
line-length = 140
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "LOG",  # flake8-logging — catches f-string in logger calls
    "G",    # flake8-logging-format
]
ignore = [
    "E203",   # whitespace before ':'
    "E501",   # line too long (handled by formatter)
    # Temporarily ignored — to be fixed in a Python code quality branch
    "G004",   # f-string in logging statement
    "G001",   # logging .format() usage
    "G003",   # logging string concatenation
    "UP006",  # use `type` instead of `Type` for type hints
    "UP035",  # deprecated imports from typing
    "UP045",  # use `X | Y` instead of `Optional[X]`
    "SIM108", # use ternary operator instead of if-else
    "SIM117", # combine `with` statements
    "SIM118", # use `key in dict` instead of `key in dict.keys()`
    "SIM101", # combine isinstance calls
    "B008",   # function call in default argument
    "B007",   # loop control variable not used within loop body
    "B017",   # do not assert blind exception
    "B020",   # loop control variable overrides iterable
    "B905",   # zip() without strict=
    "LOG015", # root logger call
]

[tool.ruff.lint.isort]
known-first-party = ["flood_forecaster", "flood_forecaster_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy configuration ───
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true

# ─── Pytest configuration ───
[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "--cov=src/flood_forecaster --cov-report=xml --cov-report=term-missing --cov-fail-under=15"
